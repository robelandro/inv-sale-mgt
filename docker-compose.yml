version: "3.8"

services:
  postgres:
    image: postgres:14-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inventory}:${POSTGRES_PASSWORD:-inventory_secret}@postgres:5432/${POSTGRES_DB:-inventory}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-in-production-to-a-very-long-random-string}
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  pgdata:
  uploads_data:
